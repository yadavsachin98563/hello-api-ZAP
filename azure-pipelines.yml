trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  IMAGE_NAME: 'hello-api-zap'
  CONTAINER_NAME: 'hello-api-test'
  PYTHON_VERSION: '3.11'

stages:

# ==========================================
# STAGE 1: BUILD AND TEST
# ==========================================

- stage: Build
  displayName: 'Build and Validate Application'

  jobs:
  - job: BuildApplication
    displayName: 'Python and Docker Build'

    steps:

    # 1. Checkout source code
    - checkout: self
      displayName: 'Checkout GitHub Repository'

    # 2. Verify project files
    - task: Bash@3
      displayName: 'Verify Project Files'
      inputs:
        targetType: inline
        script: |
          echo "Project Directory:"
          pwd

          echo "Project Files:"
          ls -la

          test -f app.py
          test -f requirements.txt
          test -f Dockerfile

          echo "All required files are available."

    # 3. Setup Python
    - task: UsePythonVersion@0
      displayName: 'Setup Python'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'

    # 4. Install dependencies
    - task: Bash@3
      displayName: 'Install Python Dependencies'
      inputs:
        targetType: inline
        script: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

    # 5. Validate Python application
    - task: Bash@3
      displayName: 'Validate Python Application'
      inputs:
        targetType: inline
        script: |
          python -m py_compile app.py

          echo "Python validation successful."


# ==========================================
# STAGE 2: DOCKER BUILD AND CONTAINER TEST
# ==========================================

- stage: Docker
  displayName: 'Docker Build and Test'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DockerBuildAndTest
    displayName: 'Build and Run Docker Container'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    # 6. Build Docker Image
    - task: Bash@3
      displayName: 'Build Application Docker Image'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="$(IMAGE_NAME):$(Build.BuildId)"

          echo "Building Docker Image: $IMAGE"

          docker build \
            -f "$(Build.SourcesDirectory)/Dockerfile" \
            -t "$IMAGE" \
            "$(Build.SourcesDirectory)"

          echo "Docker Image Created Successfully"

          docker images

    # 7. Verify Docker Image
    - task: Bash@3
      displayName: 'Verify Docker Image'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="$(IMAGE_NAME):$(Build.BuildId)"

          echo "Checking Image: $IMAGE"

          docker image inspect "$IMAGE"

          echo "Docker Image Verification Successful"

    # 8. Start Container
    - task: Bash@3
      displayName: 'Start Hello API Container'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="$(IMAGE_NAME):$(Build.BuildId)"

          echo "Starting Container"
          echo "Image: $IMAGE"

          docker run -d \
            --name "$(CONTAINER_NAME)" \
            -p 5000:5000 \
            "$IMAGE"

          echo "Container Started"

          docker ps -a

    # 9. Application Health Check
    - task: Bash@3
      displayName: 'Application Health Check'
      inputs:
        targetType: inline
        script: |
          echo "Checking Application Health"

          for i in {1..12}
          do
            if curl -fsS http://127.0.0.1:5000/; then
              echo ""
              echo "Application is responding successfully"
              exit 0
            fi

            echo "Application not ready. Retrying..."
            sleep 5
          done

          echo "Application Health Check Failed"

          docker logs "$(CONTAINER_NAME)"

          exit 1

    # 10. Cleanup
    - task: Bash@3
      displayName: 'Docker Cleanup'
      condition: always()
      inputs:
        targetType: inline
        script: |
          echo "Cleaning up test container"

          docker rm -f "$(CONTAINER_NAME)" || true

          echo "Cleanup completed"