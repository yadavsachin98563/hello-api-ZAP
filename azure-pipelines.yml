
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_NAME: hello-api-zap
  CONTAINER_NAME: hello-api-test
  IMAGE_TAG: $(Build.BuildId)

stages:

# ==========================================
# STAGE 1: APPLICATION VALIDATION
# ==========================================

- stage: Build
  displayName: 'Application Build and Validation'

  jobs:
  - job: PythonBuild
    displayName: 'Python Application Build'

    steps:

    - checkout: self
      clean: true

    - task: UsePythonVersion@0
      displayName: 'Setup Python'
      inputs:
        versionSpec: '3.11'

    - task: Bash@3
      displayName: 'Verify Project Files'
      inputs:
        targetType: inline
        script: |
          set -e

          echo "Project files:"
          ls -la

          test -f app.py
          test -f requirements.txt
          test -f Dockerfile

          echo "Project files verified."

    - task: Bash@3
      displayName: 'Install Dependencies'
      inputs:
        targetType: inline
        script: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

    - task: Bash@3
      displayName: 'Validate Python Application'
      inputs:
        targetType: inline
        script: |
          python -m py_compile app.py

          echo "Python validation successful."


# ==========================================
# STAGE 2: DOCKER IMAGE BUILD AND TEST
# ==========================================

- stage: Docker
  displayName: 'Docker Build and Test'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DockerBuild
    displayName: 'Docker Image Build and Container Test'

    steps:

    - checkout: self
      clean: true

    - task: Bash@3
      displayName: 'Build Application Docker Image'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="$(IMAGE_NAME):$(IMAGE_TAG)"

          echo "Building image: $IMAGE"

          docker build \
            -t "$IMAGE" \
            -f "$(Build.SourcesDirectory)/Dockerfile" \
            "$(Build.SourcesDirectory)"

          docker images

    - task: Bash@3
      displayName: 'Verify Docker Image'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="$(IMAGE_NAME):$(IMAGE_TAG)"

          docker image inspect "$IMAGE"

          echo "Docker image verified."

    - task: Bash@3
      displayName: 'Start Hello API Container'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="$(IMAGE_NAME):$(IMAGE_TAG)"

          docker run -d \
            --name "$(CONTAINER_NAME)" \
            -p 127.0.0.1:5000:5000 \
            "$IMAGE"

          docker ps -a

    - task: Bash@3
      displayName: 'Test API Endpoints'
      inputs:
        targetType: inline
        script: |
          set -e

          echo "Testing API endpoints..."

          for i in {1..10}
          do
            if curl -fsS http://127.0.0.1:5000/; then
              break
            fi

            sleep 3
          done

          curl -fsS http://127.0.0.1:5000/

          echo ""
          curl -fsS http://127.0.0.1:5000/api/hello

          echo ""
          echo "Both API endpoints tested successfully."

    - task: Bash@3
      displayName: 'Docker Cleanup'
      condition: always()
      inputs:
        targetType: inline
        script: |
          docker rm -f "$(CONTAINER_NAME)" || true
          echo "Container cleanup completed."