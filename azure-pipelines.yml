
# =========================================================
# HELLO API ZAP - AZURE DEVOPS CI PIPELINE
# Application: Python Flask
# Repository: hello-api-ZAP
# Branch: main
# =========================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_NAME: hello-api-zap
  CONTAINER_NAME: hello-api-test
  PYTHON_VERSION: '3.11'
  APP_PORT: '5000'
  HEALTH_URL: 'http://127.0.0.1:5000/'

stages:

# =========================================================
# STAGE 1 - SOURCE CODE VALIDATION
# =========================================================

- stage: Build
  displayName: 'Build and Validate Python Application'

  jobs:
  - job: BuildApplication
    displayName: 'Python Application Validation'

    steps:

    # 1. Checkout source code
    - checkout: self
      clean: true
      displayName: 'Checkout GitHub Repository'

    # 2. Verify repository and project files
    - task: Bash@3
      displayName: 'Verify Project Files'
      inputs:
        targetType: inline
        script: |
          set -e

          echo "=================================="
          echo "PROJECT DIRECTORY"
          echo "=================================="

          pwd
          ls -la

          echo "=================================="
          echo "VERIFY REQUIRED FILES"
          echo "=================================="

          test -f app.py
          test -f requirements.txt
          test -f Dockerfile

          echo "All required files are available."

    # 3. Setup Python
    - task: UsePythonVersion@0
      displayName: 'Setup Python Environment'
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true

    # 4. Install dependencies
    - task: Bash@3
      displayName: 'Install Python Dependencies'
      inputs:
        targetType: inline
        script: |
          set -e

          python --version
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          echo "Dependencies installed successfully."

    # 5. Validate Python code
    - task: Bash@3
      displayName: 'Python Syntax Validation'
      inputs:
        targetType: inline
        script: |
          set -e

          python -m py_compile app.py

          echo "Python syntax validation successful."


# =========================================================
# STAGE 2 - DOCKER BUILD AND APPLICATION TEST
# =========================================================

- stage: Docker
  displayName: 'Docker Build and Application Test'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DockerBuildAndTest
    displayName: 'Docker Build and Container Test'

    steps:

    - checkout: self
      clean: true

    # 6. Build Docker Image
    - task: Bash@3
      displayName: 'Build Application Docker Image'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Building Docker Image: ${IMAGE}"

          docker build \
            --pull \
            -f "${BUILD_SOURCESDIRECTORY}/Dockerfile" \
            -t "${IMAGE}" \
            "${BUILD_SOURCESDIRECTORY}"

          echo "Docker image build successful."

          docker images
      env:
        IMAGE_NAME: $(IMAGE_NAME)
        IMAGE_TAG: $(Build.BuildId)
        BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)

    # 7. Verify Docker Image
    - task: Bash@3
      displayName: 'Verify Docker Image'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Verifying image: ${IMAGE}"

          docker image inspect "${IMAGE}" >/dev/null

          echo "Docker image verification successful."
      env:
        IMAGE_NAME: $(IMAGE_NAME)
        IMAGE_TAG: $(Build.BuildId)

    # 8. Start Docker Container
    - task: Bash@3
      displayName: 'Start Hello API Container'
      inputs:
        targetType: inline
        script: |
          set -e

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Image: ${IMAGE}"
          echo "Container: ${CONTAINER_NAME}"

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 127.0.0.1:${APP_PORT}:5000 \
            "${IMAGE}"

          echo "Container started successfully."

          docker ps -a
      env:
        IMAGE_NAME: $(IMAGE_NAME)
        IMAGE_TAG: $(Build.BuildId)
        CONTAINER_NAME: $(CONTAINER_NAME)
        APP_PORT: $(APP_PORT)

    # 9. Application Health Check
    - task: Bash@3
      displayName: 'Application Health Check'
      inputs:
        targetType: inline
        script: |
          echo "Checking application health..."

          for i in {1..12}
          do
            if curl -fsS "${HEALTH_URL}"; then
              echo ""
              echo "Application is healthy."
              exit 0
            fi

            echo "Application is not ready. Attempt: ${i}/12"
            sleep 5
          done

          echo "Application health check failed."

          docker logs "${CONTAINER_NAME}"

          exit 1
      env:
        HEALTH_URL: $(HEALTH_URL)
        CONTAINER_NAME: $(CONTAINER_NAME)

    # 10. Docker Container Cleanup
    - task: Bash@3
      displayName: 'Docker Cleanup'
      condition: always()
      inputs:
        targetType: inline
        script: |
          echo "Cleaning up test container..."

          docker rm -f "${CONTAINER_NAME}" || true

          echo "Docker cleanup completed."
      env:
        CONTAINER_NAME: $(CONTAINER_NAME)
